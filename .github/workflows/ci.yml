name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run pre-commit hooks
        # The full git history is scanned for secrets by the job below.
        env:
          SKIP: gitleaks
        run: pipx run pre-commit run --all-files --show-diff-on-failure

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      - name: Scan every commit
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .

  links:
    name: Link check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,429 './**/*.md'
          fail: true
