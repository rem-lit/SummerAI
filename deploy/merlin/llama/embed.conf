# /etc/llama/embed.conf in the retrieval container: embedding model, RTX 3060.
# An input must fit in one physical batch (-ub), hence -b and -ub equal to the
# context of the slot.
LLAMA_ARGS=-m /var/lib/llama/models/Qwen3-Embedding-0.6B-Q8_0.gguf --alias qwen3-embedding-0.6b \
  --host 127.0.0.1 --port 9932 --api-key-file /etc/llama/api-key \
  -ngl 99 --embedding -c 8192 -np 1 -b 8192 -ub 8192 -fa on \
  --no-ui -lm dio --no-slots --metrics
