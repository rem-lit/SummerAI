# /etc/llama/chat.conf in the LLM container: main language model, RTX 3090.
LLAMA_ARGS=-m /var/lib/llama/models/Qwen3.8-27B-UD-Q4_K_XL.gguf --alias qwen3.8-27b \
  --host 127.0.0.1 --port 9931 --api-key-file /etc/llama/api-key \
