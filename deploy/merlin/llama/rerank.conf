# /etc/llama/rerank.conf in the retrieval container: reranker, RTX 3060.
# A query and its document must fit in one physical batch (-ub).
LLAMA_ARGS=-m /var/lib/llama/models/qwen3-reranker-0.6b-q8_0.gguf --alias qwen3-reranker-0.6b \
  --host 127.0.0.1 --port 9933 --api-key-file /etc/llama/api-key \
  -ngl 99 --rerank -c 8192 -np 1 -b 8192 -ub 8192 -fa on \
  --no-ui -lm dio --no-slots --metrics
